<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMATRIX.exe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The Desktop Environment -->
    <div class="desktop">
        
        <!-- The Fake Windows XP Window -->
        <div class="xp-window">
            <!-- Title Bar -->
            <div class="xp-titlebar">
                <span class="xp-title">TheMATRIX.exe</span>
                <div class="xp-controls">
                    <button class="xp-btn minimize">_</button>
                    <button class="xp-btn maximize">□</button>
                    <button class="xp-btn close">X</button>
                </div>
            </div>
            <!-- Window Content (The Black Void) -->
            <div class="xp-content">
                <div class="terminal" id="output">
                    <span id="cursor" class="cursor"></span>
                </div>
            </div>
        </div>

        <!-- The Fake Taskbar -->
        <div class="taskbar">
            <div class="start-btn">
                <span>start</span>
            </div>
            <div class="taskbar-clock">
                <span id="clock">10:42 AM</span>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
