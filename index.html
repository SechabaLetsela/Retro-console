<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheMATRIX.exe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Tahoma:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- The Desktop Environment -->
        <div class="desktop">
        
        <!-- Desktop Icons (Top-Left) -->
        <div class="desktop-icons">
            <div class="desktop-icon" data-tooltip="View information about your computer, and change settings.">
                <img src="icons/my computer.ico" class="icon-image" alt="My Computer">
                <div class="icon-label">My Computer</div>
            </div>
                <div class="desktop-icon" data-tooltip="The default place for storing your documents, pictures, music, and other files.">
                <img src="icons/documents.ico" class="icon-image" alt="My Documents">
                <div class="icon-label">My Documents</div>
            </div>
            <div class="desktop-icon" data-tooltip="Connected to irc.efnet.org #matrix_channel - 3 users online">
                <img src="icons/mirc.ico" class="icon-image" alt="mIRC">
                <div class="icon-label">mIRC</div>
            </div>
            <div class="desktop-icon" data-tooltip="Enter the Matrix v1.0 - Disc 1 of 2 (Insert Disc 2 to continue)">
                <div class="icon-image">🕶️</div>
                <div class="icon-label">Enter the Matrix</div>
            </div>
            <div class="desktop-icon" data-tooltip="Now Playing: Clubbed to Death - Rob Dougan [03:47/07:22]">
                <img src="icons/winamp.ico" class="icon-image" alt="Winamp">
                <div class="icon-label">Winamp</div>
            </div>
            <div class="desktop-icon" data-tooltip="I keep falling. But the ground never comes. Why does it feel more real than waking up?">
                <div class="icon-image">📝</div>
                <div class="icon-label">Zzzz.txt</div>
            </div>
            <div class="desktop-icon" data-tooltip="THPS3 - High Score: 847,293 (Warehouse run, no cheats)">
                <div class="icon-image">🛹</div>
                <div class="icon-label">Tony Hawk's Pro Skater</div>
            </div>
            <div class="desktop-icon" data-tooltip="Downloading: Linkin_Park_-_Numb.mp3 - 2.3MB of 4.7MB (12 KB/s) - 3 min remaining">
                <div class="icon-image">📥</div>
                <div class="icon-label">LimeWire</div>
            </div>
        </div>

        <!-- Recycle Bin (Bottom-Right) -->
        <div class="desktop-icon recycle-bin" data-tooltip="Contains files and folders that you have deleted.">
            <img src="icons/full recycle bin.ico" class="icon-image" alt="Recycle Bin">
            <div class="icon-label">Recycle Bin</div>
        </div>
        
        <!-- The Fake Windows XP Window -->
        <div class="xp-window">
            <!-- Title Bar -->
            <div class="xp-titlebar">
                <span class="xp-title">TheMATRIX.exe</span>
                <div class="xp-controls">
                    <button class="xp-btn minimize">_</button>
                    <button class="xp-btn maximize">□</button>
                    <button class="xp-btn close">X</button>
                </div>
            </div>
            <!-- Window Content (The Black Void) -->
            <div class="xp-content">
                <div class="terminal" id="output">
                    <span id="cursor" class="cursor"></span>
                </div>
            </div>
        </div>

        <!-- The Fake Taskbar -->
        <div class="taskbar">
            <div class="start-btn">
                <span>start</span>
            </div>
            <div class="taskbar-clock">
                <span id="clock">10:42 AM</span>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
    <script src="audio.js"></script>
</body>
</html>
